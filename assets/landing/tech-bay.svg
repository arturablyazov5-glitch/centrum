<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Разрез отсека для компьютера: воздух заходит через фильтр в фасаде, проходит через системный блок и выходит в боковую стенку">
<defs>
<linearGradient id="air" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="760" y2="0">
<stop offset="0" stop-color="#8fb8e0"/>
<stop offset=".45" stop-color="#c9b08a"/>
<stop offset="1" stop-color="#e8a961"/>
</linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#8a5f43"/>
<stop offset="1" stop-color="#5a3d2c"/>
</linearGradient>
<marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#e8a961"/>
</marker>
</defs>
<style>
.flow{stroke-dasharray:14 18;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<rect width="800" height="600" fill="#141418"/>
<ellipse cx="400" cy="546" rx="330" ry="14" fill="#000" opacity=".45"/>
<line x1="40" y1="540" x2="760" y2="540" stroke="#2a2a31" stroke-width="2"/>
<!-- корпус -->
<rect x="140" y="150" width="520" height="390" rx="6" fill="#1b1b20"/>
<rect x="110" y="118" width="580" height="36" rx="7" fill="url(#top)"/>
<rect x="110" y="118" width="580" height="3" rx="1.5" fill="#b08466" opacity=".6"/>
<!-- отсек -->
<rect x="200" y="200" width="380" height="316" rx="4" fill="#0e0e11" stroke="#34343c" stroke-width="2"/>
<rect x="201" y="201" width="378" height="56" fill="#16161b"/>
<line x1="201" y1="257" x2="579" y2="257" stroke="#34343c" stroke-width="2" stroke-dasharray="6 6"/>
<!-- фильтр в фасаде -->
<g stroke="#56565f" stroke-width="3" stroke-linecap="round">
<line x1="150" y1="436" x2="150" y2="504"/><line x1="162" y1="436" x2="162" y2="504"/><line x1="174" y1="436" x2="174" y2="504"/><line x1="186" y1="436" x2="186" y2="504"/>
</g>
<!-- кабельный канал -->
<rect x="604" y="160" width="26" height="380" rx="5" fill="#222228"/>
<g stroke="#4a4a53" stroke-width="3" stroke-linecap="round">
<line x1="612" y1="176" x2="612" y2="526"/><line x1="622" y1="176" x2="622" y2="526"/>
</g>
<!-- системный блок -->
<rect x="296" y="286" width="190" height="214" rx="10" fill="#24242b" stroke="#3a3a42" stroke-width="2"/>
<circle cx="391" cy="352" r="38" fill="none" stroke="#4d4d56" stroke-width="3"/>
<circle cx="391" cy="352" r="9" fill="#4d4d56"/>
<g stroke="#34343c" stroke-width="3" stroke-linecap="round">
<line x1="322" y1="428" x2="460" y2="428"/><line x1="322" y1="444" x2="460" y2="444"/><line x1="322" y1="460" x2="420" y2="460"/>
</g>
<circle cx="462" cy="304" r="4" fill="#e8a961"/>
<!-- воздух -->
<path d="M40 470 H330 Q391 470 391 420 V262 Q391 232 421 232 H752" fill="none" stroke="url(#air)" stroke-width="5" stroke-opacity=".22" stroke-linecap="round"/>
<path class="flow" d="M40 470 H330 Q391 470 391 420 V262 Q391 232 421 232 H752" fill="none" stroke="url(#air)" stroke-width="5" stroke-linecap="round" marker-end="url(#head)"/>
</svg>
