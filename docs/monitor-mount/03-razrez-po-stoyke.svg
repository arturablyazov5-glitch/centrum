<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -70 2280 1240" width="1600" height="870" role="img" aria-label="03 · Разрез по стойке"><title>03 · Разрез по стойке — CENTRUM</title><rect x="-160" y="-70" width="2280" height="1240" style="fill:#fff"/><text x="700" y="-20" style="font-family:Arial,Helvetica,sans-serif;font-size:44px;fill:#222;text-anchor:middle;font-weight:700">Разрез по стойке · от центра к стенке</text><text x="700" y="25" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#555;text-anchor:middle;font-weight:400">Экран 27″ на руке. Стойка зажата между двумя шинами и не касается ни реек, ни накладки.</text><path d="M508 660 L1150 660 L1150 720 L500 720 L500 668 Q500 660 508 660 Z" style="stroke:#222;stroke-width:1.2;fill:#e8dfd5;stroke-linecap:round;stroke-linejoin:round"/><rect x="508" y="656" width="642" height="4" rx="0" style="stroke:#222;stroke-width:0.6;fill:#555;stroke-linecap:round;stroke-linejoin:round"/><text x="640" y="754" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#555;text-anchor:start;font-weight:400">рабочее кольцо 60 · накладка 4</text><rect x="1150" y="298" width="24" height="322" rx="0" style="stroke:#222;stroke-width:0.5;fill:#8a8a8a;stroke-linecap:round;stroke-linejoin:round"/><rect x="1174" y="298" width="20" height="322" rx="0" style="fill:#f4f4f4;stroke:#999;stroke-width:0.5"/><rect x="1135" y="298" width="27" height="322" rx="0" style="stroke:#222;stroke-width:0.7;fill:#c9b39c;stroke-linecap:round;stroke-linejoin:round"/><rect x="1194" y="270" width="18" height="450" rx="0" style="stroke:#222;stroke-width:1;fill:#d9d9d9;stroke-linecap:round;stroke-linejoin:round"/><rect x="1150" y="620" width="44" height="40" rx="0" style="stroke:#222;stroke-width:1;fill:#35383b;stroke-linecap:round;stroke-linejoin:round"/><rect x="1150" y="270" width="44" height="28" rx="0" style="stroke:#222;stroke-width:1;fill:#35383b;stroke-linecap:round;stroke-linejoin:round"/><path d="M1090 210 L1400 210 L1400 270 L1132 270 L1132 248 L1108 248 L1108 270 L1090 270 Z" style="stroke:#222;stroke-width:1.2;fill:#e8dfd5;stroke-linecap:round;stroke-linejoin:round"/><rect x="1110" y="250" width="20" height="4" rx="0" style="fill:#ffd27a;stroke:none"/><line x1="1350" y1="270" x2="1350" y2="720" style="stroke:#222;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round"/><line x1="1212" y1="720" x2="1350" y2="720" style="stroke:#222;stroke-width:1;fill:none;stroke-linecap:round;stroke-linejoin:round"/><path d="M1225 320 L1225 350 L1275 350 L1275 320" style="stroke:#286780;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round"/><path d="M1285 380 L1285 410 L1335 410 L1335 380" style="stroke:#98502e;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round"/><rect x="1088" y="280" width="40" height="374" rx="0" style="stroke:#222;stroke-width:1;fill:#35383b;stroke-linecap:round;stroke-linejoin:round"/><rect x="1084" y="274" width="66" height="30" rx="0" style="stroke:#222;stroke-width:1;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><rect x="1150" y="278" width="16" height="8" rx="0" style="stroke:#222;stroke-width:0.6;fill:#777;stroke-linecap:round;stroke-linejoin:round"/><rect x="1084" y="622" width="66" height="32" rx="0" style="stroke:#222;stroke-width:1;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><rect x="1150" y="636" width="16" height="8" rx="0" style="stroke:#222;stroke-width:0.6;fill:#777;stroke-linecap:round;stroke-linejoin:round"/><rect x="1078" y="414" width="50" height="36" rx="0" style="stroke:#222;stroke-width:1;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><path d="M1080 432 L960 470 L870 394" style="stroke:#4a4e52;stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round"/><rect x="850" y="368" width="30" height="52" rx="0" style="stroke:#222;stroke-width:1;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><rect x="800" y="210" width="50" height="368" rx="0" style="stroke:#222;stroke-width:1.2;fill:#1c1c1c;stroke-linecap:round;stroke-linejoin:round"/><rect x="800" y="224" width="4" height="340" rx="0" style="fill:#2c6e8f;stroke:none"/><rect x="640" y="648" width="100" height="8" rx="0" style="stroke:#222;stroke-width:0.8;fill:#eee;stroke-linecap:round;stroke-linejoin:round"/><circle cx="50" cy="150" r="95" style="stroke:#999;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round"/><circle cx="120" cy="180" r="7" style="fill:#222"/><line x1="120" y1="180" x2="1060" y2="180" style="stroke:#999;stroke-width:1;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 6"/><line x1="120" y1="180" x2="800" y2="394" style="stroke:#2c6e8f;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 6"/><text x="160" y="214" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">глаза ≈ +1300* (сиденье ≈ +540, рост 175)</text><text x="430" y="310" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2c6e8f;text-anchor:start;font-weight:400">17,5° вниз — на центр экрана</text><path d="M850 480 C930 490 1000 480 1090 440 L1100 284 L1170 282 L1200 282 L1215 310 L1240 340" style="stroke:#286780;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 5"/><path d="M850 490 C930 502 1000 490 1116 450 L1116 288 L1176 288 L1205 288 L1260 370 L1300 395" style="stroke:#98502e;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"/><line x1="1360" y1="660" x2="1430" y2="660" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1440" y="668" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">+820 рабочая</text><line x1="1360" y1="620" x2="1430" y2="620" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1440" y="628" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">+860</text><line x1="1360" y1="298" x2="1430" y2="298" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1440" y="306" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">+1182</text><line x1="1360" y1="270" x2="1430" y2="270" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1440" y="278" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">+1210 низ выступа</text><line x1="1360" y1="210" x2="1430" y2="210" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1440" y="218" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">+1270 = верх экрана</text><line x1="1045" y1="640" x2="1045" y2="284" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><line x1="1037" y1="640" x2="1070" y2="640" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><line x1="1037" y1="284" x2="1070" y2="284" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1038" y="330" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:end;font-weight:400">356</text><text x="1038" y="354" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#555;text-anchor:end;font-weight:400">между осями шин</text><line x1="800" y1="740" x2="800" y2="780" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="806" y="786" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">R800 экран</text><line x1="1108" y1="740" x2="1108" y2="820" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="1114" y="826" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">R1108 ось стойки</text><line x1="1150" y1="740" x2="1150" y2="860" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="1156" y="866" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#222;text-anchor:start;font-weight:400">R1150 шина</text><line x1="1180" y1="282" x2="1440" y2="110" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1446" y="117" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">ВШ · верхняя шина 28 × 44 — винты вверх в плиту</text><line x1="1180" y1="640" x2="1440" y2="750" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1446" y="757" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">НШ · нижняя шина 40 × 44 — вместо цоколя 40</text><line x1="1148" y1="380" x2="1440" y2="500" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1446" y="507" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">рейки 10 × 27 на войлоке: 860…1182 (было до 1210)</text><line x1="1120" y1="252" x2="1000" y2="150" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="994" y="157" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:end;font-weight:400">паз LED — свет не перекрыт</text><line x1="1250" y1="340" x2="1440" y2="340" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1446" y="347" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">лоток данных · радиус 1250, +1150</text><line x1="1310" y1="405" x2="1440" y2="420" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="1446" y="427" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">силовой лоток*</text><line x1="1100" y1="580" x2="960" y2="600" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="954" y="607" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:end;font-weight:400">стойка Ø40, графит</text><line x1="1100" y1="654" x2="960" y2="680" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="954" y="687" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:end;font-weight:400">зазор до накладки 2</text><line x1="1080" y1="432" x2="790" y2="480" style="stroke:#555;stroke-width:0.8;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="784" y="487" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:end;font-weight:400">хомут руки: +870…1180</text><text x="-120" y="1010" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Стойка зажата сверху и снизу: момент от экрана 20 кг на вылете 600 — 118 Н·м, на шину приходится 118 / 0,356 ≈ 331 Н. Не качается при наборе текста.</text><text x="-120" y="1044" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Кабели из руки идут в стойку, вверх по ней и сразу в щель верхней шины. Данные — в лоток данных, 230 В — отдельно, в силовой лоток. На столе и на стенке проводов нет.</text><text x="-120" y="1078" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Верх экрана — на уровне верхней столешницы +1270: она же линия глаз. Выше +1210 корпус экрана не должен заходить дальше R1085 (кромка выступа R1090).</text><text x="-120" y="1112" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:start;font-weight:400">* Стенка 62 = паз 44 + лист 18 (виды 28, 38; решение 28.09.2026). Положение силового лотка на этом разрезе условное.</text></svg>
