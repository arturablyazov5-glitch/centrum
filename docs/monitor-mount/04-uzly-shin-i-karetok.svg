<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 0 1980 1230" width="1600" height="994" role="img" aria-label="04 · Узлы шин и кареток"><title>04 · Узлы шин и кареток — CENTRUM</title><rect x="60" y="0" width="1980" height="1230" style="fill:#fff"/><text x="900" y="50" style="font-family:Arial,Helvetica,sans-serif;font-size:40px;fill:#222;text-anchor:middle;font-weight:700">Узлы · шины и каретки, масштаб 4:1</text><text x="120" y="274" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#222;text-anchor:start;font-weight:700">Б · Верхняя шина ВШ + каретка ВК</text><rect x="576" y="376" width="72" height="192" rx="0" style="stroke:#222;stroke-width:1;fill:#d9d9d9;stroke-linecap:round;stroke-linejoin:round"/><path d="M400 520 L576 520 L576 424 L400 424 L400 452 L416 452 L416 440 L512 440 L512 504 L416 504 L416 492 L400 492 Z" style="stroke:#222;stroke-width:1.3;fill:#9aa0a5;stroke-linecap:round;stroke-linejoin:round"/><path d="M402 452 L412 469.60000000000036 L412 452 Z M402 492 L412 474.39999999999964 L412 492 Z" style="fill:#222;stroke:none"/><path d="M140 424 L660 424 L660 336 L328 336 L328 336 L232 336 L232 424 Z" style="stroke:#222;stroke-width:1;fill:#e8dfd5;stroke-linecap:round;stroke-linejoin:round"/><rect x="328" y="336" width="332" height="88" rx="0" style="stroke:#222;stroke-width:1;fill:#e8dfd5;stroke-linecap:round;stroke-linejoin:round"/><rect x="240" y="344" width="80" height="16" rx="0" style="fill:#ffd27a;stroke:none"/><line x1="544" y1="424" x2="544" y2="360" style="stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="554" y="376" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">М6 вверх в плиту, шаг 150</text><rect x="136" y="440" width="264" height="120" rx="0" style="stroke:#222;stroke-width:1.2;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><rect x="152" y="464" width="160" height="120" rx="0" style="stroke:#222;stroke-width:1;fill:#35383b;stroke-linecap:round;stroke-linejoin:round"/><rect x="400" y="456" width="24" height="32" rx="0" style="stroke:#222;stroke-width:1;fill:#777;stroke-linecap:round;stroke-linejoin:round"/><rect x="424" y="440" width="40" height="64" rx="0" style="stroke:#222;stroke-width:1.2;fill:#b7bcc0;stroke-linecap:round;stroke-linejoin:round"/><line x1="200" y1="464" x2="200" y2="444" style="stroke:#222;stroke-width:1;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="404" y="560" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">щель 10 · губки ТПЭ</text><text x="136" y="600" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">гильза ВК: посадка на стойку</text><text x="136" y="626" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">скользящая ±5 — допуск высоты</text><text x="136" y="652" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">стенки не важен; только горизонталь</text><text x="470" y="472" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">«молоток» 16 × 60</text><text x="670" y="480" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">окна 60 × 14 через 150 —</text><text x="670" y="506" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">кабель уходит в пояс</text><text x="120" y="860" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;fill:#222;text-anchor:start;font-weight:700">А · Нижняя шина НШ + каретка НК</text><rect x="576" y="872" width="72" height="256" rx="0" style="stroke:#222;stroke-width:1;fill:#d9d9d9;stroke-linecap:round;stroke-linejoin:round"/><path d="M400 1080 L576 1080 L576 920 L400 920 L400 980 L416 980 L416 936 L512 936 L512 1064 L416 1064 L416 1020 L400 1020 Z" style="stroke:#222;stroke-width:1.3;fill:#9aa0a5;stroke-linecap:round;stroke-linejoin:round"/><path d="M402 980 L412 997.5999999999999 L412 980 Z M402 1020 L412 1002.4000000000001 L412 1020 Z" style="fill:#222;stroke:none"/><path d="M80 1080 L400 1080 L400 1136 L80 1136" style="stroke:#222;stroke-width:1;fill:#e8dfd5;stroke-linecap:round;stroke-linejoin:round"/><rect x="80" y="1064" width="320" height="16" rx="0" style="stroke:#222;stroke-width:0.6;fill:#555;stroke-linecap:round;stroke-linejoin:round"/><rect x="136" y="928" width="264" height="128" rx="0" style="stroke:#222;stroke-width:1.2;fill:#4a4e52;stroke-linecap:round;stroke-linejoin:round"/><rect x="152" y="880" width="160" height="160" rx="0" style="stroke:#222;stroke-width:1;fill:#35383b;stroke-linecap:round;stroke-linejoin:round"/><rect x="400" y="984" width="24" height="32" rx="0" style="stroke:#222;stroke-width:1;fill:#777;stroke-linecap:round;stroke-linejoin:round"/><rect x="424" y="944" width="40" height="112" rx="0" style="stroke:#222;stroke-width:1.2;fill:#b7bcc0;stroke-linecap:round;stroke-linejoin:round"/><circle cx="360" cy="992" r="14" style="stroke:#222;stroke-width:1;fill:#fff;stroke-linecap:round;stroke-linejoin:round"/><text x="360" y="1126" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:middle;font-weight:400">эксцентрик</text><line x1="576" y1="1000" x2="640" y2="1000" style="stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round"/><text x="654" y="1006" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">М5 во втулку, шаг 100</text><text x="80" y="1170" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">НК несёт вес: 2 мм над накладкой — кожа не мнётся</text><text x="424" y="916" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:start;font-weight:400">«молоток» 10 × 28 × 60</text><text x="1000" y="180" style="font-family:Arial,Helvetica,sans-serif;font-size:26px;fill:#222;text-anchor:start;font-weight:700">В · «Молоток»: стойка ставится в любой точке</text><text x="1000" y="212" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#555;text-anchor:start;font-weight:400">вид на лицо шины</text><rect x="850" y="270" width="300" height="120" rx="0" style="stroke:#222;stroke-width:1;fill:#9aa0a5;stroke-linecap:round;stroke-linejoin:round"/><rect x="850" y="310" width="300" height="40" rx="0" style="fill:#fff;stroke:#222;stroke-width:1"/><rect x="880" y="298" width="240" height="64" rx="6" style="stroke:#222;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4"/><text x="1000" y="500" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:middle;font-weight:400">1 · вдоль щели — входит</text><rect x="1210" y="270" width="300" height="120" rx="0" style="stroke:#222;stroke-width:1;fill:#9aa0a5;stroke-linecap:round;stroke-linejoin:round"/><rect x="1210" y="310" width="300" height="40" rx="0" style="fill:#fff;stroke:#222;stroke-width:1"/><rect x="1328" y="210" width="64" height="240" rx="6" style="stroke:#222;stroke-width:1.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4"/><text x="1360" y="500" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:middle;font-weight:400">2 · рычаг: поворот 90°</text><rect x="1570" y="270" width="300" height="120" rx="0" style="stroke:#222;stroke-width:1;fill:#9aa0a5;stroke-linecap:round;stroke-linejoin:round"/><rect x="1570" y="310" width="300" height="40" rx="0" style="fill:#fff;stroke:#222;stroke-width:1"/><rect x="1688" y="210" width="64" height="240" rx="6" style="stroke:#222;stroke-width:1.2;fill:#b7bcc0;stroke-linecap:round;stroke-linejoin:round"/><text x="1720" y="500" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#222;text-anchor:middle;font-weight:400">3 · прижат к губам щели</text><text x="1000" y="560" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Сдвигать стойку с конца шины не нужно: снять или поставить — где угодно.</text><text x="1000" y="592" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Эксцентрик прижимает каретку к лицу шины — люфта нет. Под ним скрытый шестигранник 5.</text><text x="1000" y="700" style="font-family:Arial,Helvetica,sans-serif;font-size:26px;fill:#222;text-anchor:start;font-weight:700">Г · Состав</text><text x="1000" y="750" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">НШ</text><text x="1060" y="750" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">нижняя шина 40 × 44, алюминий, гнутая по R1150</text><text x="1790" y="750" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">5 частей</text><text x="1000" y="790" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">ВШ</text><text x="1060" y="790" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">верхняя шина 24 × 44, окна для кабеля через 150</text><text x="1790" y="790" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">5 частей</text><text x="1000" y="830" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">НК</text><text x="1060" y="830" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">нижняя каретка: вес и момент, эксцентрик, «молоток»</text><text x="1790" y="830" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">1 на стойку</text><text x="1000" y="870" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">ВК</text><text x="1060" y="870" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">верхняя каретка: гильза со скольжением, выход шлейфа</text><text x="1790" y="870" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">1 на стойку</text><text x="1000" y="910" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">СТ</text><text x="1060" y="910" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">стойка Ø40 × 374, два канала: данные / 230 В</text><text x="1790" y="910" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">до 3 на стол</text><text x="1000" y="950" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">РК</text><text x="1060" y="950" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">рука на газлифте или VESA-головка — покупная*</text><text x="1790" y="950" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">по экрану</text><text x="1000" y="990" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">ШЛ</text><text x="1060" y="990" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">шлейф: AOC DP / HDMI 5–8 м + шнур 230 В</text><text x="1790" y="990" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">по экрану</text><text x="1000" y="1030" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:700">ЗГ</text><text x="1060" y="1030" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">губки ТПЭ в щелях, торцевые заглушки шин</text><text x="1790" y="1030" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#555;text-anchor:end;font-weight:400">в базе</text><text x="1000" y="1100" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Части шины: 854 + 903 + 602 + 903 + 854 = 4116 по дуге R1150.</text><text x="1000" y="1132" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Стык частей — два штифта Ø4, крайний винт в 25 от торца: ступенька ≤ 0,1*.</text><text x="1000" y="1164" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;fill:#222;text-anchor:start;font-weight:400">Испытание образца*: 2 × 118 Н·м на стойку — без остаточной деформации.</text></svg>
