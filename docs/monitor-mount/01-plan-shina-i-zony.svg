ont-family:Arial,Helvetica,sans-serif;font-size:50px;fill:#222;text-anchor:start;font-weight:400">конец шины: каретка 120 целиком на прямой стенке</text><rect x="0" y="3140" width="110" height="22" rx="0" style="fill:#35383b;stroke:none"/><text x="140" y="3180" style="font-family:Arial,Helvetica,sans-serif;font-size:50px;fill:#222;text-anchor:start;font-weight:400">шина: две полосы по R1150 (+820…860 и +1186…1210), 4117 по дуге каждая</text><line x1="0" y1="3240" x2="110" y2="3240" style="stroke:#286780;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 9"/><text x="140" y="3260" style="font-family:Arial,Helvetica,sans-serif;font-size:50px;fill:#222;text-anchor:start;font-weight:400">лоток данных в поясе; кабели входят в него из шины в любой точке дуги</text><text x="0" y="3400" style="font-family:Arial,Helvetica,sans-serif;font-size:46px;fill:#555;text-anchor:start;font-weight:400">Свободно при MAX + 5.1: 6,2…23,8° · 36,2…56,5° · 87,3…93,8° справа; слева так же, но пост длиннее: до −91,6°.</text><text x="0" y="3470" style="font-family:Arial,Helvetica,sans-serif;font-size:46px;fill:#555;text-anchor:start;font-weight:400">BASE без 5.1: 0…61,1° и 78,9…99,1° справа; 0…−61,1° и −74,6…−99,1° слева.</text><text x="0" y="3540" style="font-family:Arial,Helvetica,sans-serif;font-size:46px;fill:#555;text-anchor:start;font-weight:400">Экран не обязан стоять перед стойкой: рука выносит его на 20–25° в сторону (лист 02).</text></svg>
