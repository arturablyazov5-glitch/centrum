<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820" font-family="Helvetica, Arial, sans-serif">
<rect width="1500" height="820" fill="#fff"/><g transform="translate(90,0)">
<text x="40" y="40" font-size="24" font-weight="700" fill="#222">Куда тянет кабель · скос 45° против гнезда «лицом к человеку»</text>
<text x="40" y="64" font-size="14" fill="#666">Разрез по кромке, 2,5 : 1. Угол — между осью штекера и направлением кабеля. Чем он больше, тем сильнее кабель гнёт штекер и гнездо.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="60.0" y="110.0" font-size="17" fill="#222" text-anchor="start" font-weight="700">Было: скос 45°, штекер смотрит вниз</text>
<polygon points="360.0,340.0 365.0,331.2 380.0,320.0 660.0,320.0 660.0,470.0 460.0,470.0 365.0,375.0 360.0,375.0" fill="#c9a27a" stroke="#7a5a3a"/>
<polygon points="365.0,375.0 460.0,470.0 500.0,470.0 500.0,455.0 585.0,455.0 585.0,395.0 390.0,395.0" fill="#3a3a3c"/>
<line x1="412.5" y1="422.5" x2="348.861" y2="486.1" stroke="#999" stroke-width="17.5" stroke-linecap="round"/>
<line x1="348.861" y1="486.1" x2="205.10150643796095" y2="297.1" stroke="#2e7d4f" stroke-width="3" marker-end="url(#a)"/>
<text x="197.1" y="291.1" font-size="13" fill="#2e7d4f" text-anchor="end" font-weight="700">сидя, к уху: 98°</text>
<line x1="348.861" y1="486.1" x2="263.441165889227" y2="264.5" stroke="#c07a10" stroke-width="3" marker-end="url(#a)"/>
<text x="255.4" y="258.5" font-size="13" fill="#c07a10" text-anchor="end" font-weight="700">встал: 114°</text>
<line x1="348.861" y1="486.1" x2="128.74185244327904" y2="397.0" stroke="#7a4ea0" stroke-width="3" marker-end="url(#a)"/>
<text x="120.7" y="391.0" font-size="13" fill="#7a4ea0" text-anchor="end" font-weight="700">уходит к выходу: 67°</text>
<line x1="412.5" y1="422.5" x2="271.08000000000004" y2="563.9" stroke="#555" stroke-dasharray="5 4"/>
<text x="271.1" y="581.9" font-size="12" fill="#555" text-anchor="middle" font-weight="400">ось штекера</text>
<text x="666.0" y="324.0" font-size="12" fill="#777" text-anchor="start" font-weight="400">+820</text>
<text x="666.0" y="474.0" font-size="12" fill="#777" text-anchor="start" font-weight="400">+760</text>
<text x="60.0" y="750.0" font-size="14" fill="#c8453a" text-anchor="start" font-weight="400">Кабель сразу загибается вверх почти на 100°,</text>
<text x="60.0" y="770.0" font-size="14" fill="#c8453a" text-anchor="start" font-weight="400">а если встать — на 115°. Штекер работает рычагом:</text>
<text x="60.0" y="790.0" font-size="14" fill="#c8453a" text-anchor="start" font-weight="400">гнётся он или гнездо. Вы правы.</text>
<text x="740.0" y="110.0" font-size="17" fill="#222" text-anchor="start" font-weight="700">Предлагаю: гнездо в кармане, штекер — к человеку</text>
<polygon points="1040.0,340.0 1045.0,331.2 1060.0,320.0 1340.0,320.0 1340.0,470.0 1152.5,470.0 1152.5,375.0 1040.0,375.0" fill="#c9a27a" stroke="#7a5a3a"/>
<polygon points="1090.0,375.0 1090.0,470.0 1152.5,470.0 1152.5,455.0 1265.0,455.0 1265.0,390.0 1090.0,390.0" fill="#3a3a3c"/>
<line x1="1090.0" y1="422.5" x2="1000.0" y2="422.5" stroke="#999" stroke-width="17.5" stroke-linecap="round"/>
<line x1="1000.0" y1="422.5" x2="854.4635959765033" y2="234.8" stroke="#2e7d4f" stroke-width="3" marker-end="url(#a)"/>
<text x="846.5" y="228.8" font-size="13" fill="#2e7d4f" text-anchor="end" font-weight="700">сидя, к уху: 52°</text>
<line x1="1000.0" y1="422.5" x2="914.9643002341311" y2="200.7" stroke="#c07a10" stroke-width="3" marker-end="url(#a)"/>
<text x="907.0" y="194.7" font-size="13" fill="#c07a10" text-anchor="end" font-weight="700">встал: 69°</text>
<line x1="1000.0" y1="422.5" x2="778.8854936315876" y2="335.8" stroke="#7a4ea0" stroke-width="3" marker-end="url(#a)"/>
<text x="770.9" y="329.8" font-size="13" fill="#7a4ea0" text-anchor="end" font-weight="700">уходит к выходу: 21°</text>
<line x1="1090.0" y1="422.5" x2="890.0" y2="422.5" stroke="#555" stroke-dasharray="5 4"/>
<text x="890.0" y="440.5" font-size="12" fill="#555" text-anchor="middle" font-weight="400">ось штекера</text>
<text x="1346.0" y="324.0" font-size="12" fill="#777" text-anchor="start" font-weight="400">+820</text>
<text x="1346.0" y="474.0" font-size="12" fill="#777" text-anchor="start" font-weight="400">+760</text>
<text x="740.0" y="750.0" font-size="14" fill="#2e7d4f" text-anchor="start" font-weight="400">Сидя кабель уходит к уху под ~50°, вставшему — ~70°.</text>
<text x="740.0" y="770.0" font-size="14" fill="#2e7d4f" text-anchor="start" font-weight="400">Уходите к выходу — тянет почти вдоль оси,</text>
<text x="740.0" y="790.0" font-size="14" fill="#2e7d4f" text-anchor="start" font-weight="400">штекер просто выходит из гнезда.</text>
</g></svg>