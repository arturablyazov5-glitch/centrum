<line x1="450.0" y1="314.0" x2="885.0" y2="300.0" stroke="#b56a0c" stroke-width="1"/>
<text x="889.0" y="304.0" font-size="14" fill="#b56a0c" text-anchor="start" font-weight="700">Центр · в базе</text>
<text x="889.0" y="321.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">φ 0°, под клавиатурой, между коленями</text>
<text x="889.0" y="338.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">жгут 3 м: в камеру над Tech Bay (лист 51)</text>
<line x1="603.6" y1="442.9" x2="885.0" y2="420.0" stroke="#3b7dd8" stroke-width="1"/>
<text x="889.0" y="424.0" font-size="14" fill="#3b7dd8" text-anchor="start" font-weight="700">Справа · опция</text>
<text x="889.0" y="441.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">φ +80°, у правого бедра</text>
<text x="889.0" y="458.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">жгут 6 м: за ящики, через хаб в поясе, к шахте</text>
<line x1="296.4" y1="442.9" x2="885.0" y2="530.0" stroke="#3b7dd8" stroke-width="1"/>
<text x="889.0" y="534.0" font-size="14" fill="#3b7dd8" text-anchor="start" font-weight="700">Слева · опция</text>
<text x="889.0" y="551.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">φ −80°, у левого бедра</text>
<text x="889.0" y="568.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">жгут 2,5 м: через К7 в шахту</text>
<line x1="262.4" y1="478.2" x2="885.0" y2="640.0" stroke="#6b4ea0" stroke-width="1"/>
<text x="889.0" y="644.0" font-size="14" fill="#6b4ea0" text-anchor="start" font-weight="700">Откидной крючок · в базе</text>
<text x="889.0" y="661.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">φ −92°, наушники висят</text>
<text x="889.0" y="678.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">подключёнными</text>
<line x1="646.7" y1="235.6" x2="885.0" y2="190.0" stroke="#6a6a6a" stroke-width="1"/>
<text x="889.0" y="194.0" font-size="14" fill="#6a6a6a" text-anchor="start" font-weight="700">Жгуты — трубами внутри столешницы</text>
<text x="889.0" y="211.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">соты кольца, снизу ничего не видно</text>
<text x="1175.0" y="110.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Как устроено</text>
<text x="1175.0" y="129.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Панель пассивная: 3,5 мм, USB-C, USB-A.</text>
<text x="1175.0" y="148.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Внутри только гнёзда и провод,</text>
<text x="1175.0" y="167.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">своей платы нет.</text>
<text x="1175.0" y="205.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">В Tech Bay — распределитель</text>
<text x="1175.0" y="224.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Подключается к разъёмам передней</text>
<text x="1175.0" y="243.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">панели на плате ПК: звук HD Audio</text>
<text x="1175.0" y="262.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">и USB. Раздаёт их на три панели.</text>
<text x="1175.0" y="300.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Почему центр в базе</text>
<text x="1175.0" y="319.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Работает, пока вы лицом к экрану</text>
<text x="1175.0" y="338.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">и при повороте вправо. Одинаков</text>
<text x="1175.0" y="357.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">для левшей и правшей и для</text>
<text x="1175.0" y="376.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">кабеля из любой чашки.</text>
<text x="1175.0" y="414.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Боковые панели</text>
<text x="1175.0" y="433.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Для тех, кто работает у боковых</text>
<text x="1175.0" y="452.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">станций. Ставятся потом за один</text>
<text x="1175.0" y="471.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">визит: карман и труба уже есть.</text>
<rect x="777.0" y="317.9" width="18" height="12" fill="#3b7dd8" stroke="#1d4f95"/>
<line x1="795.0" y1="323.9" x2="885.0" y2="760.0" stroke="#3b7dd8" stroke-width="1"/>
<text x="889.0" y="764.0" font-size="14" fill="#3b7dd8" text-anchor="start" font-weight="700">Хаб справа · с боковыми панелями</text>
<text x="889.0" y="781.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">в поясе над стояком ящиков: USB 2.0 — 5 м</text>
<text x="889.0" y="798.0" font-size="12" fill="#555" text-anchor="start" font-weight="400">до устройства, от хаба до панели 1,1 м</text>
<rect x="60" y="915" width="26" height="12" fill="#e08a1e"/>
<text x="96.0" y="926.0" font-size="13" fill="#333" text-anchor="start" font-weight="400">панель в базе</text>
<rect x="320" y="915" width="26" height="12" fill="#3b7dd8"/>
<text x="356.0" y="926.0" font-size="13" fill="#333" text-anchor="start" font-weight="400">панели-опции</text>
<rect x="580" y="915" width="26" height="12" fill="#6b4ea0"/>
<text x="616.0" y="926.0" font-size="13" fill="#333" text-anchor="start" font-weight="400">откидной крючок</text>
<rect x="840" y="915" width="26" height="12" fill="#6a6a6a"/>
<text x="876.0" y="926.0" font-size="13" fill="#333" text-anchor="start" font-weight="400">жгут к распределителю (пунктир), труба в сотах — полоса</text>
</svg>