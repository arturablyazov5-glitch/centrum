<line x1="176.0" y1="952.0" x2="176.0" y2="976.0" stroke="#999"/>
<text x="176.0" y="992.0" font-size="14" fill="#222" text-anchor="middle" font-weight="700">USB-C</text>
<text x="176.0" y="1008.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">наушники и гарнитуры USB-C,</text>
<text x="176.0" y="1024.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">переходники USB-C → 3,5</text>
<line x1="280.0" y1="952.0" x2="280.0" y2="1060.0" stroke="#999"/>
<text x="280.0" y="1076.0" font-size="14" fill="#222" text-anchor="middle" font-weight="700">3,5 мм, 4 контакта</text>
<text x="280.0" y="1092.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">в середине — находится первым</text>
<text x="280.0" y="1108.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">наушники и гарнитуры</text>
<text x="280.0" y="1124.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">с микрофоном (CTIA)</text>
<line x1="384.0" y1="952.0" x2="384.0" y2="976.0" stroke="#999"/>
<text x="384.0" y="992.0" font-size="14" fill="#222" text-anchor="middle" font-weight="700">USB-A</text>
<text x="384.0" y="1008.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">приёмник беспроводной</text>
<text x="384.0" y="1024.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">гарнитуры или мыши —</text>
<text x="384.0" y="1040.0" font-size="12" fill="#555" text-anchor="middle" font-weight="400">у головы, а не в шкафу</text>
<text x="530.0" y="800.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Что подключается</text>
<text x="530.0" y="820.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">3,5 мм — почти все проводные наушники и гарнитуры.</text>
<text x="530.0" y="840.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">USB-C — наушники и гарнитуры с Type-C, в том числе</text>
<text x="530.0" y="860.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">новые без джека, и переходники «USB-C → 3,5».</text>
<text x="530.0" y="880.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">USB-A — USB-гарнитуры со старым штекером и приёмники</text>
<text x="530.0" y="900.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">беспроводных гарнитур: радио рядом с головой, а не</text>
<text x="530.0" y="920.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">за стенкой шкафа Tech Bay.</text>
<text x="530.0" y="960.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Как находится вслепую</text>
<text x="530.0" y="980.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Рука опускается к кромке — пальцы заходят в карман.</text>
<text x="530.0" y="1000.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">3,5 мм в середине, USB по бокам.</text>
<text x="530.0" y="1020.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">Риски над гнёздами читаются пальцем. В кармане — тусклая</text>
<text x="530.0" y="1040.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">подсветка от USB, горит, пока включён ПК.</text>
<text x="530.0" y="1080.0" font-size="15" fill="#222" text-anchor="start" font-weight="700">Чего нет и почему</text>
<text x="530.0" y="1100.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">6,35 и 4,4 мм — у редких студийных наушников, в комплекте</text>
<text x="530.0" y="1120.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">с ними почти всегда переходник на 3,5.</text>
</svg>