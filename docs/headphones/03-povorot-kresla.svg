<text x="40" y="40" font-size="24" font-weight="700" fill="#222">Поворот кресла · куда можно смотреть в наушниках</text>
<text x="40" y="64" font-size="14" fill="#666">Вид сверху, экран вверху. Цветная дуга — куда вы смотрите. Кабель 1,2 м из левой чашки — худший случай.</text>
