<text x="756.0" y="651.0" font-size="13" fill="#333" text-anchor="start" font-weight="400">кабель обходит спинку и натягивается</text>
<text x="60.0" y="700.0" font-size="13" fill="#555" text-anchor="start" font-weight="400">С витым удлинителем (в коробке, 0,5 м сжатый — 3 м растянутый) кабель дотягивается и в жёлтых, и в красных зонах, но в красных всё равно ложится на спинку кресла.</text>
