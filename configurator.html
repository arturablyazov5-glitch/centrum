  <body>
    <div class="configurator-shell">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Вернуться к CENTRUM">CENTRUM</a>
        <div class="topbar-center"><span>Конфигуратор</span><b data-progress></b></div>
        <div class="top-actions">
          <button type="button" data-copy-link>Скопировать ссылку</button>
          <button type="button" data-reset-view>Сбросить ракурс</button>
          <button type="button" data-reset-all>Сбросить всё</button>
        </div>
      </header>

      <main class="workspace">
        <nav class="category-nav" id="category-nav" aria-label="Категории конфигуратора"></nav>
        <section class="scene" aria-label="Интерактивная 3D-модель CENTRUM V1">
          <canvas id="centrum-canvas" tabindex="0" aria-label="3D-модель CENTRUM. Перетащите для поворота, используйте колесо для масштаба."></canvas>
          <div class="scene-loader" id="scene-loader"><strong>CENTRUM</strong><span>Loading 3D...</span></div>
          <div class="hotspots" id="hotspots"></div>
          <div class="scene-help">Перетащите, чтобы повернуть · колесо — масштаб</div>
        </section>
        <aside class="options-panel" id="options-panel" aria-live="polite"></aside>
      </main>

      <footer class="price-bar" id="price-bar">
        <div class="price-model"><strong data-model-name></strong><span data-config-caption></span></div>
        <div class="price-stat"><span>База</span><strong data-base-price></strong></div>
        <div class="price-stat"><span>Опции</span><strong data-options-price></strong></div>
        <div class="price-total"><span>Итого</span><strong data-total-price></strong><small><span data-deposit-label></span> · <b data-deposit-price></b></small></div>
        <button class="primary-cta" type="button" data-open-preorder>Оформить предзаказ</button>
      </footer>
    </div>

    <div class="preorder-modal" id="preorder-modal" hidden role="dialog" aria-modal="true" aria-labelledby="preorder-title">
      <button class="modal-backdrop" type="button" data-close-modal aria-label="Закрыть"></button>

        <div class="modal-price"><div><span data-modal-model></span><strong data-modal-total></strong></div><div><span data-modal-deposit-label></span><strong data-modal-deposit></strong></div></div>

          <p class="form-status" data-form-status aria-live="polite"></p>
        </form>
      </div>
